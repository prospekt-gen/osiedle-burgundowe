<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Osiedle Burgundowe — Nowosolna, Łódź | BS DOM</title>
  <meta name="description" content="Osiedle Burgundowe w Nowosolnej — przedłużenie Osiedla Kasprowicza. Premium domy w zabudowie szeregowej w otoczeniu Parku Krajobrazowego Wzniesień Łódzkich. Pompa ciepła, rekuperacja, światłowód w standardzie. Deweloper BS DOM." />

  <!-- ====== FONTY ====== -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- ====== TAILWIND (Play CDN) ====== -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            serif: ['"Cormorant Garamond"', 'ui-serif', 'Georgia', 'serif'],
          },
          colors: {
            cream:   '#F9F8F4',
            ink:     '#1A251E',
            inkSoft: '#2C3E35',
            forest:  '#4A5D4E',
            gold:    '#E3A857',
            bronze:  '#8B7355',
            mist:    '#A9B2AD',
            burgundy: '#7A2E3A',
            burgundyLight: '#9C4250',
          },
        },
      },
    };
  </script>

  <!-- ====== REACT (app.js to prekompilowany JSX → bez Babela w runtime) ====== -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    html { scroll-behavior: smooth; }
    body { background: #F9F8F4; }
    section[id] { scroll-margin-top: 90px; }

    ::selection { background: #7A2E3A; color: #fff; }

    /* Custom scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(122,46,58,0.35); border-radius: 99px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(122,46,58,0.6); }

    /* Fallback dla niezaładowanych zdjęć stockowych */
    .img-fallback {
      background:
        radial-gradient(120% 120% at 0% 0%, rgba(227,168,87,0.25), transparent 50%),
        linear-gradient(135deg, #2C3E35 0%, #1A251E 55%, #7A2E3A 130%);
    }

    /* Scroll reveal */
    [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
    [data-reveal].is-visible { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      [data-reveal] { opacity: 1 !important; transform: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="app.js"></script>
</body>
</html>
